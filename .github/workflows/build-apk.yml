name: Compilar APK Master Movie

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación web
        run: npm run build

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Capacitor CLI y plataforma Android
        run: |
          npm install @capacitor/cli @capacitor/android @capacitor/core
          npx cap add android || true
          npx cap sync android

      - name: Configurar permisos de red HTTP zonacero en AndroidManifest.xml
        run: |
          # Asegurar android:usesCleartextTraffic="true" para zonacero.lat:8080
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi

      - name: Otorgar permisos a Gradle
        run: |
          cd android
          chmod +x ./gradlew || true

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Master-Movie-Android.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
