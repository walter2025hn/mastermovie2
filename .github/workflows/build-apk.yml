name: Compilar APK Master Movie

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación web
        run: npm run build

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Aceptar licencias del SDK de Android e instalar herramientas
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" || true

      - name: Instalar Capacitor CLI y sincronizar Android
        run: |
          npm install @capacitor/cli @capacitor/android @capacitor/core
          npx cap add android || true
          npx cap sync android

      - name: Asegurar iconos de Master Movie y configuracion de red
        run: |
          mkdir -p android/app/src/main/res/xml
          if [ -d "resources/android-res" ]; then
            cp -r resources/android-res/* android/app/src/main/res/ || true
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
            fi
            if ! grep -q 'networkSecurityConfig' "$MANIFEST"; then
              sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/g' "$MANIFEST"
            fi
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Master-Movie-Android.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
